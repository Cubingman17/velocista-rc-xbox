name: Compilar Velocista RC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain ARM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential

      - name: Clonar Bluepad32 y Pico SDK
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/ricardoquesada/bluepad32.git bluepad32
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/raspberrypi/pico-sdk.git pico-sdk

      - name: Poner el firmware del velocista encima del ejemplo
        run: |
          cp src/main.c src/my_platform.c bluepad32/examples/pico_w/src/
          # el firmware usa hardware/pwm.h para los DRV8833: hay que enlazarlo
          echo 'target_link_libraries(bluepad32_picow_example_app PRIVATE hardware_pwm hardware_clocks)' >> bluepad32/examples/pico_w/CMakeLists.txt

      - name: Compilar (Pico 2 W)
        run: |
          set +e
          {
            cd bluepad32/examples/pico_w
            mkdir build && cd build
            cmake -DPICO_BOARD=pico2_w -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" ..
            make -j4
            mv bluepad32_picow_example_app.uf2 velocista_rc_pico2w.uf2
            ls -la velocista_rc_pico2w.uf2
          } > "$GITHUB_WORKSPACE/build.log" 2>&1
          status=$?
          tail -c 4000 "$GITHUB_WORKSPACE/build.log"
          exit $status

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: velocista-rc-pico2w
          path: bluepad32/examples/pico_w/build/velocista_rc_pico2w.uf2

      - name: Crear Release con el UF2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "rc-${GITHUB_RUN_NUMBER}" \
            bluepad32/examples/pico_w/build/velocista_rc_pico2w.uf2 \
            --title "Velocista RC build $GITHUB_RUN_NUMBER" \
            --notes "Firmware para la Pico 2 W del velocista. Flashear: BOOTSEL + arrastrar el .uf2. Controles y demas en el README."

      - name: Avisar si fallo la compilacion
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Fallo la compilacion (run $GITHUB_RUN_NUMBER)" --body "$(tail -c 6000 build.log 2>/dev/null || echo 'sin log disponible')"
